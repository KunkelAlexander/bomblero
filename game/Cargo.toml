[package]
name = "game"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4.16"
sim = { path = "../sim" }
protocol = { path = "../protocol" }
host = { path = "../host" }

# Native WebSocket for the relay connection (the browser uses its own, see
# web/net.js). No TLS feature on purpose: native is the dev build and talks to a
# local relay; browsers handle wss:// themselves.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
