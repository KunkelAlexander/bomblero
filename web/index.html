<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bomblero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Fullscreen-ish when added to a phone's home screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The canvas fills the window; the game lays itself out for its shape (see game/src/view.rs). */
    /* touch-action/user-select: thumbs on the canvas are game input, so the
       browser must not scroll, zoom or select text in response to them. */
    canvas { display: block; position: absolute; inset: 0;
             width: 100%; height: 100%; outline: none;
             touch-action: none; user-select: none; -webkit-user-select: none;
             -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- gl.js is miniquad's JS glue (copied from the miniquad crate) -->
  <script src="gl.js"></script>
  <!-- audio.js is quad-snd's Web Audio glue (copied from the quad-snd crate); sound.js
       makes sure the browser lets it play, also on phones (see game/src/audio.rs) -->
  <script src="audio.js"></script>
  <script src="sound.js"></script>
  <!-- net.js gives the game a WebSocket (see game/src/socket.rs) -->
  <script src="net.js"></script>
  <!-- device.js tells the game whether it runs on a phone (see game/src/touch.rs) -->
  <script src="device.js"></script>
  <script>load("game.wasm");</script>
</body>
</html>
